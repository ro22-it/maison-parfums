<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maison Parfums</title>
  <meta name="description" content="Maison Parfums — подбор ароматов по нотам, сезону, поводу и характеру.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  } }
  </script>
</head>
<body class="lock" data-page="home">

  <!-- интро -->
  <div class="intro" id="intro">
    <div class="intro__word" aria-hidden="true"></div>
    <div class="intro__line"></div>
  </div>

  <!-- 1. Главный экран: сцена с 3D-флаконом -->
  <section class="hero" id="hero">
    <!-- видео камина на фоне: файл кладётся в папку video/ -->
    <video class="hero__video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="video/fireplace.mp4" type="video/mp4">
      <source src="video/fireplace.webm" type="video/webm">
    </video>
    <div class="hero__canvas" id="stage"></div>
    <div class="hero__fallback" id="heroFallback"></div>
    <div class="hero__vignette"></div>

    <div class="hero__shade"></div>

    <div class="hero__center">
      <h1 class="hero__logo" data-in style="transition-delay:.2s">Maison Parfums</h1>
      <p class="hero__tagline" data-in style="transition-delay:.45s">Выбери лучший парфюм</p>
    </div>

    <button class="hero__scroll" id="toFinder" data-in style="transition-delay:.9s" aria-label="Подобрать парфюм">
      <span class="hero__scroll-label">Подобрать парфюм</span>
      <span class="hero__arrow"><svg viewBox="0 0 16 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 0" /><path d="M8 0v20M1 13l7 7 7-7"/></svg></span>
    </button>
  </section>

  <!-- 2. Подбор -->
  <section class="finder" id="finder">
    <div class="section">
      <div class="section-head reveal">
        <div>
          <div class="kicker">Подбор аромата</div>
          <h2 class="h2">Найдите <em>свой</em> аромат</h2>
        </div>
        <p class="lead">Отметьте, что вам нравится, — и мы покажем подходящие ароматы. Можно выбрать несколько вариантов в каждом пункте.</p>
      </div>

      <label class="search reveal">
        <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="11" cy="11" r="8.5"/><path d="M17.5 17.5L25 25"/></svg>
        <input id="q" type="search" placeholder="Название аромата или бренда…" autocomplete="off">
      </label>

      <div class="filters reveal" id="filters"></div>

      <div class="finder__actions reveal">
        <button class="btn" id="findBtn">Найти</button>
        <button class="btn btn--ghost" id="resetBtn">Сбросить</button>
        <span class="finder__count" id="liveCount"></span>
      </div>
    </div>
  </section>

  <!-- 3. Каталог -->
  <section id="catalog">
    <div class="section">
      <div class="section-head reveal">
        <div>
          <div class="kicker" id="resKicker">Каталог</div>
          <h2 class="h2" id="resTitle">Все <em>ароматы</em></h2>
        </div>
      </div>
      <div class="results-bar">
        <div class="similar-note" id="similarNote"></div>
        <select class="select" id="sort" aria-label="Сортировка">
          <option value="pop">По популярности</option>
          <option value="new">Сначала новые</option>
          <option value="old">Сначала классика</option>
          <option value="lon">По стойкости</option>
          <option value="az">По названию А–Я</option>
        </select>
      </div>
      <div class="grid" id="grid"></div>
      <div class="more-wrap"><button class="btn btn--ghost" id="moreBtn">Показать ещё</button></div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/data2.js"></script>
  <script src="js/data3.js"></script>
  <script src="js/data4.js"></script>
  <script src="js/data5.js"></script>
  <script src="js/data6.js"></script>
  <script src="js/data7.js"></script>
  <script src="js/data8.js"></script>
  <script src="js/data9.js"></script>
  <script src="js/data10.js"></script>
  <script src="js/common.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/bottle3d.js"></script>
</body>
</html>
